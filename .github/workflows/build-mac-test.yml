name: Build Mac Test Package

on:
  workflow_dispatch:
  push:
    branches:
      - codex-local-v3
    paths:
      - "backend/**"
      - "src/**"
      - "static/**"
      - "scripts/**"
      - "mac/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "svelte.config.js"
      - "vite.config.ts"
      - ".github/workflows/build-mac-test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-mac-arm64:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Install JS dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Build web app and host backend
        run: pnpm build

      - name: Build Apple Silicon backend from Cargo.lock
        run: |
          cargo build --locked --release \
            --target aarch64-apple-darwin \
            --manifest-path backend/Cargo.toml
          mkdir -p dist/backend/aarch64-apple-darwin
          cp backend/target/aarch64-apple-darwin/release/backend \
            dist/backend/aarch64-apple-darwin/backend
          chmod +x dist/backend/aarch64-apple-darwin/backend

      - name: Ad-hoc sign and verify backend structure
        run: |
          codesign --force --sign - --timestamp=none dist/backend/aarch64-apple-darwin/backend
          codesign --verify --verbose=2 dist/backend/aarch64-apple-darwin/backend

      - name: Verify static build
        run: pnpm verify:static-build

      - name: Package Codex Local v3
        run: |
          rm -rf package-out
          mkdir -p "package-out/Codex Local v3/build"
          mkdir -p "package-out/Codex Local v3/dist/backend/aarch64-apple-darwin"

          cp -R build/static "package-out/Codex Local v3/build/static"
          cp dist/backend/aarch64-apple-darwin/backend \
            "package-out/Codex Local v3/dist/backend/aarch64-apple-darwin/backend"
          cp mac/ABRIR.command "package-out/Codex Local v3/ABRIR.command"
          cp mac/CERRAR.command "package-out/Codex Local v3/CERRAR.command"
          cp mac/CAMBIAR_CARPETA.command "package-out/Codex Local v3/CAMBIAR_CARPETA.command"
          cp mac/VERIFICAR.command "package-out/Codex Local v3/VERIFICAR.command"
          cp mac/README.md "package-out/Codex Local v3/LEEME.md"
          cp LICENSE "package-out/Codex Local v3/LICENSE"

          chmod +x "package-out/Codex Local v3/ABRIR.command"
          chmod +x "package-out/Codex Local v3/CERRAR.command"
          chmod +x "package-out/Codex Local v3/CAMBIAR_CARPETA.command"
          chmod +x "package-out/Codex Local v3/VERIFICAR.command"

          printf "source_commit=%s\nworkflow_run=%s\nbuild_ref=%s\n" \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_REF" \
            > "package-out/Codex Local v3/BUILD_INFO.txt"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path("package-out/Codex Local v3")
          lines = []
          for path in sorted(p for p in root.rglob("*") if p.is_file() and p.name != "SHA256SUMS.txt"):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              rel = path.relative_to(root)
              lines.append(f"{digest}  {rel.as_posix()}")
          (root / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          cd package-out
          ditto -c -k --sequesterRsrc --keepParent "Codex Local v3" "Codex_Local_v3_Mac_Apple_Silicon.zip"

      - name: Print package SHA-256
        run: shasum -a 256 package-out/Codex_Local_v3_Mac_Apple_Silicon.zip

      - name: Upload test package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Codex_Local_v3_Mac_Apple_Silicon
          path: package-out/Codex_Local_v3_Mac_Apple_Silicon.zip
          if-no-files-found: error
          retention-days: 14
